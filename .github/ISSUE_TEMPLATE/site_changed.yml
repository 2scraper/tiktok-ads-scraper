name: Site changed
description: TikTok changed something and this scraper no longer reads it.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        The most common way a scraper stops working, and worth its own report
        because the fix is different from a code bug: something on
        `library.tiktok.com` moved.

        This repo reads one structured source, never the rendered page:
        `POST /api/v1/search`, gated by the `x-ccl-str` header the library's own page JavaScript mints.

        **Never paste an API key, a proxy password or a `ws://…` endpoint.**

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped working
      options:
        - HTTP 421 on every request (the token is not being minted)
        - The same ads on every page (pagination not advancing)
        - A region producing far fewer ads than the others
        - Dates in the wrong century
        - A column is null or wrong (say which)
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: What you asked for
      description: The exact target, the exit you used (datacentre, residential, or Scraping Browser), and its country.
      placeholder: "--region DE (exit: datacentre, FI)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        A capture beats a description.

        Run with `--dump-html` and attach the `<out>_ads_<REGION>_p1.json` it writes, with any cursor (`search_id`) left in.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, from a different exit, and
        when it last worked.
